# =============================================================================
# TOT library (Phase L-6): 4-layer Python + C ABI test integration.
#
# Same shape as the per-module L-6 rows above. tot is the integrated
# orchestrator so its parameter space is the union of the per-module
# registries; equivalence / sweep use namespaced names ("eq:RR",
# "tr:DT", ...). Layer 1 + Layer 4 auto-skip until TOT_RUN_OK=1 is set
# (orchestrator init/run/get_state/finalize are L-3/L-4/L-5 stubs).
# =============================================================================
totlib_c_abi:python:make -C tot tot_api_check_all:none:600:Layer 2 C ABI suite (smoke/param/run_so/negative)
totlib_wrapper:python:python3 -m unittest -v totlib.tests.test_totlib:none:120:Layer 3 Tot class + TotState shape
totlib_ffi:python:python3 -m unittest -v totlib.tests.test_ffi:none:60:Layer 3 _ffi ctypes-layer checks
totlib_equivalence:python:python3 -m unittest -v totlib.tests.test_equivalence:none:300:Layer 1 equivalence vs L-0 baselines (tol 1e-10, TOT_RUN_OK gated)
totlib_sweep:python:python3 -m unittest -v totlib.tests.test_sweep:none:300:Layer 4 3x3 eq:RR x eq:BB sweep smoke (TOT_RUN_OK gated)
