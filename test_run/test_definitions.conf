# TASK Test Definitions
# Format: TEST_NAME:MODULE:INPUT_FILE:DEPENDS:TIMEOUT:DESCRIPTION
#
# Fields:
#   TEST_NAME   - Unique test identifier
#   MODULE      - Module to run (eq, tr, fp, tx)
#   INPUT_FILE  - Input file path (relative to module dir, or @test_run for local inputs)
#   DEPENDS     - Comma-separated list of tests that must run first (or "none")
#   TIMEOUT     - Timeout in seconds
#   DESCRIPTION - Short description of the test
#
# Input file paths:
#   - "in/file.in" -> looks in $TASK_DIR/$MODULE/in/file.in
#   - "@inputs/file.in" -> looks in $TEST_RUN_DIR/inputs/file.in
#
# Lines starting with # are comments
# Empty lines are ignored

# =============================================================================
# EQ Module Tests (Equilibrium calculation)
# =============================================================================
eq_iter01:eq:in/eq.ITER01.in:none:60:ITER equilibrium calculation
eq_jt60:eq:in/eq.injt60:none:60:JT-60 equilibrium calculation
eq_tst2:eq:in/eq.TST-2.in:none:60:TST-2 equilibrium calculation

# =============================================================================
# TR Module Tests (Transport calculation)
# Uses local test input with shortened calculation time
# =============================================================================
tr_iter01:tr:@inputs/tr_iter01.in:eq_iter01:120:ITER transport (short)
tr_m0904:tr:@inputs/tr_m0904.in:none:120:M0904 transport (analytic geometry)
tr_tst2:tr:@inputs/tr_tst2.in:eq_tst2:120:TST-2 transport

# =============================================================================
# TX Module Tests (1D Transport)
# Standalone - no dependencies
# =============================================================================
tx_std:tx:@inputs/tx_std.in:none:60:Standard 1D transport test

# =============================================================================
# TI Module Tests (Impurity transport calculation)
# Standalone - no dependencies (analytic profile, no EQ data needed)
# =============================================================================
ti_min:ti:@inputs/ti_min.in:none:60:Minimum ti run (NSMAX=1, NRMAX=10)
ti_ar:ti:@inputs/ti_ar.in:none:120:Ar impurity transport (NRMAX=20, NTMAX=10)
ti_w:ti:@inputs/ti_w.in:none:120:W impurity transport (NRMAX=20, NTMAX=5)

# =============================================================================
# FP Module Tests (Fokker-Planck solver)
# =============================================================================
fp_iter01:fp:@inputs/fp_iter01.in:none:600:ITER FP (NSAMAX=1, NTMAX=2)
fp_jt60:fp:@inputs/fp_jt60.in:none:600:JT-60 FP (NRMAX=11)
fp_dt1:fp:@inputs/fp_dt1.in:none:300:DT1 FP (NRMAX=1 minimal)

# WR Module Tests (Wave ray-tracing)
# =============================================================================
wr_iter_lhcd:wr:@inputs/wr_iter_lhcd.in:none:120:WR ITER LHCD case
wr_test001:wr:@inputs/wr_test001.in:none:120:WR test001 short case
wr_tst2_ec:wr:@inputs/wr_tst2_ec.in:none:120:WR TST-2 EC case

# =============================================================================
# TOT Module Tests (Integrated simulator orchestrating eq/tr/ti/fp/wr/...)
# Uses local test inputs with shortened menu sequences (graphics suppressed).
# =============================================================================
tot_demo2014_short:tot:@inputs/tot_demo2014_short.in:none:240:DEMO2014 integrated short-form
tot_ht6m_short:tot:@inputs/tot_ht6m_short.in:none:240:HT6M integrated short-form
