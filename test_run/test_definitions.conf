# TASK Test Definitions
# Format: TEST_NAME:MODULE:INPUT_FILE:DEPENDS:TIMEOUT:DESCRIPTION
#
# Fields:
#   TEST_NAME   - Unique test identifier
#   MODULE      - Module to run (eq, tr, fp, tx)
#   INPUT_FILE  - Input file path (relative to module dir, or @test_run for local inputs)
#   DEPENDS     - Comma-separated list of tests that must run first (or "none")
#   TIMEOUT     - Timeout in seconds
#   DESCRIPTION - Short description of the test
#
# Input file paths:
#   - "in/file.in" -> looks in $TASK_DIR/$MODULE/in/file.in
#   - "@inputs/file.in" -> looks in $TEST_RUN_DIR/inputs/file.in
#
# Lines starting with # are comments
# Empty lines are ignored

# =============================================================================
# EQ Module Tests (Equilibrium calculation)
# =============================================================================
eq_iter01:eq:in/eq.ITER01.in:none:60:ITER equilibrium calculation
eq_jt60:eq:in/eq.injt60:none:60:JT-60 equilibrium calculation
eq_tst2:eq:in/eq.TST-2.in:none:60:TST-2 equilibrium calculation

# =============================================================================
# TR Module Tests (Transport calculation)
# Uses local test input with shortened calculation time
# =============================================================================
tr_iter01:tr:@inputs/tr_iter01.in:eq_iter01:120:ITER transport (short)
tr_m0904:tr:@inputs/tr_m0904.in:none:120:M0904 transport (analytic geometry)
tr_tst2:tr:@inputs/tr_tst2.in:eq_tst2:120:TST-2 transport
# The two tr_fus_* cases DRIFT against run_tests.sh's hard-coded 1e-10 by
# construction: their baselines are bpsi trx captures, and kyoshimi differs
# from trx by a median 4.8e-8 (10 keV) / 2.2e-7 (1 keV) on these decks for
# reasons outside fusion -- a transport-layer difference that first appears in
# the time-advance, NOT in initialisation: at NTMAX=0 the two codes agree to
# 5.7e-16.  See baselines/tr_fus_dt_hot/SOURCE.md, "Known open gap".  Expect
# REGRESSION from run_tests.sh until that closes (worst 6.7e-4 on the 10 keV
# deck, 2.5e-4 on the 1 keV one).
# They are not in any gating job -- no pytest reads this file, and
# regen-baselines.yml runs an explicit fixture list that excludes both.
tr_fus_dt:tr:@inputs/tr_fus_dt.in:none:120:DT fusion at 1 keV (model_pnf=1) vs bpsi trx [EXPECTED DRIFT at 1e-10; weak signal, see tr_fus_dt_hot]
tr_fus_dt_hot:tr:@inputs/tr_fus_dt_hot.in:none:120:DT fusion at 10 keV (model_pnf=1) vs bpsi trx [EXPECTED DRIFT at 1e-10; PRIMARY Task 7 oracle]

# =============================================================================
# TX Module Tests (1D Transport)
# Standalone - no dependencies
# =============================================================================
tx_std:tx:@inputs/tx_std.in:none:60:Standard 1D transport test

# =============================================================================
# TI Module Tests (Impurity transport calculation)
# Standalone - no dependencies (analytic profile, no EQ data needed)
# =============================================================================
ti_min:ti:@inputs/ti_min.in:none:60:Minimum ti run (NSMAX=1, NRMAX=10)
ti_ar:ti:@inputs/ti_ar.in:none:120:Ar impurity transport (NRMAX=20, NTMAX=10)
ti_w:ti:@inputs/ti_w.in:none:120:W impurity transport (NRMAX=20, NTMAX=5)

# =============================================================================
# FP Module Tests (Fokker-Planck solver)
# =============================================================================
fp_iter01:fp:@inputs/fp_iter01.in:none:600:ITER FP (NSAMAX=1, NTMAX=2)
fp_jt60:fp:@inputs/fp_jt60.in:none:600:JT-60 FP (NRMAX=11)
fp_dt1:fp:@inputs/fp_dt1.in:none:300:DT1 FP (NRMAX=1 minimal)

# WR Module Tests (Wave ray-tracing)
# =============================================================================
wr_iter_lhcd:wr:@inputs/wr_iter_lhcd.in:none:120:WR ITER LHCD case
wr_test001:wr:@inputs/wr_test001.in:none:120:WR test001 short case
wr_tst2_ec:wr:@inputs/wr_tst2_ec.in:none:120:WR TST-2 EC case

# WRX Module Tests (Extended wave ray-tracing)
# =============================================================================
wrx_iter01:wrx:@inputs/wrx_iter01.in:none:120:WRX ITER ECCD case
wrx_demo:wrx:@inputs/wrx_demo.in:none:120:WRX demo case
wrx_jt60:wrx:@inputs/wrx_jt60.in:none:120:WRX JT-60 ECCD case

# =============================================================================
# TOT Module Tests (Integrated simulator orchestrating eq/tr/ti/fp/wr/...)
# =============================================================================
tot_demo2014_short:tot:@inputs/tot_demo2014_short.in:none:240:DEMO2014 integrated short-form
tot_ht6m_short:tot:@inputs/tot_ht6m_short.in:none:240:HT6M integrated short-form

# =============================================================================
# TR library (Phase L-6): 4-layer Python + C ABI test integration.
#
# MODULE=python (added in this phase) reinterprets the 3rd column as a
# shell command executed from $TASK_DIR with PYTHONPATH=python. Commands
# must NOT contain ':' because the parser splits on colons.
#
# Layer 1 (equivalence)  -- libtrapi.so replay vs Phase 0 baseline (tol 1e-10)
# Layer 2 (C ABI)        -- smoke/param/run/run_so/negative
# Layer 3 (Python wrap)  -- Trlib lifecycle + ctypes shape
# Layer 4 (sweep)        -- 3x3 smoke loop
# =============================================================================
trlib_c_abi:python:make -C tr tr_api_check_all:none:300:Layer 2 C ABI suite (smoke/param/run/run_so/negative)
trlib_wrapper:python:python3 -m unittest -v trlib.tests.test_trlib:none:120:Layer 3 Trlib class + ctypes shape
trlib_ffi:python:python3 -m unittest -v trlib.tests.test_ffi:none:60:Layer 3 _ffi ctypes-layer checks
trlib_equivalence:python:python3 -m unittest -v trlib.tests.test_equivalence:none:300:Layer 1 equivalence vs Phase 0 baselines (tol 1e-10)
trlib_sweep:python:python3 -m unittest -v trlib.tests.test_sweep:none:180:Layer 4 3x3 RR x BB sweep smoke

# =============================================================================
# TI library (Phase L-6): 4-layer Python + C ABI test integration.
# =============================================================================
tilib_c_abi:python:make -C ti ti_api_check_all:none:300:Layer 2 C ABI suite (negative tests)
tilib_wrapper:python:python3 -m unittest -v tilib.tests.test_tilib:none:120:Layer 3 TiLib class + ctypes shape
tilib_ffi:python:python3 -m unittest -v tilib.tests.test_ffi:none:60:Layer 3 _ffi ctypes-layer checks
tilib_equivalence:python:python3 -m unittest -v tilib.tests.test_equivalence:none:300:Layer 1 equivalence vs Phase 0 baselines (tol 1e-10)
tilib_sweep:python:python3 -m unittest -v tilib.tests.test_sweep:none:180:Layer 4 3x3 DT x NRMAX sweep smoke

