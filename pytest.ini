# The single pytest configuration for this repository (#241).
#
# python/conftest.py installs the strict unittest.subTest override. pytest
# loads the conftest files between the rootdir and each test file, and the
# rootdir is the directory of the first ini file found from a test path
# upwards. This file makes that directory the repository root for every
# invocation (from the root, from inside a module's tests/ directory, for a
# bare single-file path). Do NOT add [tool.pytest.ini_options] sections to
# package pyproject.toml files under python/: a nearer config would become
# the rootdir and silently hide python/conftest.py (the MCP packages had one
# each; removed in the #241 fix).
[pytest]
