name: python-tests

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Cancel superseded runs on the same branch to save minutes
concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-subtests
          # tomli is needed only on <3.11; keep installed for safety on 3.11 too.
          pip install tomli

      - name: Run pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: python
        run: |
          python -m pytest python/ \
            --tb=short \
            -ra \
            --maxfail=20

      - name: Show collected vs skipped summary
        if: always()
        env:
          PYTHONPATH: python
        run: |
          python -m pytest python/ --collect-only -q | tail -5 || true
